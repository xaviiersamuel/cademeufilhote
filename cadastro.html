    .brand {

    .signup-card {

    .signup-card h2 {

    #form-cadastro{
      display: flex;

      gap: 5px;

      margin-bottom: 7px;

    .field label {
      display: block;
      margin-bottom: 3px;

<body>
  <main class="signup-page">
    <a href="index.php" class="brand" style="text-decoration: none;" aria-label="Cadê meu filhotinho?">

    </a>

    <section class="signup-card" aria-labelledby="signup-title">
      <h2 id="signup-title">Ainda não tem conta? Crie uma</h2>

      <form id="form-cadastro" action="processa_cadastro.php" method="post">
        <div class="field">
          <label for="nome">Nome completo:</label>
          <input id="nome" name="nome" type="text" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="telefone">Telefone de contato:</label>
          <input id="telefone" name="telefone" type="tel" autocomplete="tel" required />
        </div>

        <div class="field">
          <label for="email">Email:</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="senha">Crie uma senha:</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password" required />
        </div>

        <button class="submit-button" type="submit">Cadastrar</button>
      </form>

      <p class="signup-text" style="margin-top: 20px; text-align: center; font-size: 11px; font-family: Nunito, sans-serif;">
        Ou se preferir, navegue no modo <a href="index.php" style="color: #238bb4; text-decoration: none;">visitante</a>
